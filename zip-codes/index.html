<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZIP Coverage Analysis</title>
  <style>
    :root {
      --bg: #f3f8f5;
      --surface: #ffffff;
      --border: #d7e8df;
      --text: #153126;
      --muted: #536f62;
      --brand: #1d6b4d;
      --brand-strong: #144f3a;
      --warn: #b75d1b;
      --danger: #b42318;
      --shadow: 0 12px 28px rgba(17, 49, 38, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top left, #dfeee6 0%, transparent 35%),
        radial-gradient(circle at bottom right, #edf8f3 0%, transparent 25%),
        var(--bg);
      color: var(--text);
      padding: 18px;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .head {
      background: linear-gradient(135deg, #e4f3eb 0%, #f9fcfa 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.5vw, 2rem);
    }

    .sub {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.5;
    }

    .body {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-weight: 700;
      color: var(--muted);
      font-size: 0.95rem;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font: 500 0.92rem/1.5 Consolas, "Courier New", monospace;
      background: #fbfefc;
      color: var(--text);
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 10px;
      height: 42px;
      padding: 0 15px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover { background: var(--brand-strong); }

    button.secondary {
      background: #ebf5ef;
      color: var(--brand-strong);
      border: 1px solid var(--border);
    }

    .status {
      min-height: 1.2rem;
      color: var(--warn);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .kpi {
      background: linear-gradient(180deg, #f7fbf8 0%, #ffffff 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
    }

    .kpi .label {
      color: var(--muted);
      font-size: 0.82rem;
      text-transform: none;
    }

    .kpi .value {
      margin-top: 6px;
      font-size: 1.1rem;
      font-weight: 800;
    }

    .table-wrap {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
      max-height: 560px;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e7efe9;
      text-align: left;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      background: #edf7f1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.76rem;
      color: #24533f;
      z-index: 1;
    }

    tr.zero td {
      background: #fff2f1;
      color: var(--danger);
    }

    @media (max-width: 980px) {
      .grid, .kpis { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="head">
        <h1>ZIP Coverage Analysis</h1>
        <div class="sub">Compare outreach event data against a distressed ZIP list and prioritize the least-served ZIP codes first.</div>
      </div>

      <div class="body">
        <div class="grid">
          <div class="field">
            <label for="distressedInput">Distressed ZIP list</label>
            <textarea id="distressedInput" placeholder="Paste your distressed ZIPs here (5-digit ZIPs extracted automatically)"></textarea>
          </div>

          <div class="field">
            <label for="csvFileInput">Outreach CSV</label>
            <input id="csvFileInput" type="file" accept=".csv,text/csv" />
            <div class="toolbar">
              <button id="loadDefaultBtn" type="button">Load Default CSV</button>
              <button id="analyzeBtn" type="button">Analyze Coverage</button>
              <button id="clearBtn" type="button" class="secondary">Clear Results</button>
            </div>
            <div class="status" id="status"></div>
          </div>
        </div>

        <div class="kpis">
          <div class="kpi">
            <div class="label">Distressed ZIPs</div>
            <div class="value" id="kpiDistressed">0</div>
          </div>
          <div class="kpi">
            <div class="label">ZIPs with outreach</div>
            <div class="value" id="kpiServed">0</div>
          </div>
          <div class="kpi">
            <div class="label">ZIPs with no outreach</div>
            <div class="value" id="kpiUnserved">0</div>
          </div>
          <div class="kpi">
            <div class="label">Coverage rate</div>
            <div class="value" id="kpiCoverage">0.0%</div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>ZIP</th>
                <th>City</th>
                <th>Events</th>
                <th>Total Attendees/Views</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

    distressedInputEl.value = defaultZips;

    function parseDistressedZips(text) {
      const matches = text.match(/\b\d{5}\b/g) || [];
      return [...new Set(matches)].sort();
    }

    function parseCsvLine(line) {
      const out = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];

        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          out.push(current);
          current = "";
        } else {
          current += ch;
        }
      }

      out.push(current);
      return out;
    }

    function parseCsvRows(csvText) {
      const lines = csvText
        .replace(/^\uFEFF/, "")
        .split(/\r?\n/)
        .filter(line => line.trim().length > 0);

      if (!lines.length) return [];

      const headers = parseCsvLine(lines[0]).map(h => h.trim());
      const rows = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = parseCsvLine(lines[i]);
        const row = {};
        headers.forEach((header, idx) => {
          row[header] = (cols[idx] || "").trim();
        });
        rows.push(row);
      }

      return rows;
    }

    function normalizeZip(raw) {
      const digits = String(raw || "").replace(/\D/g, "");
      if (digits.length < 5) return "";
      return digits.slice(0, 5);
    }

    function numeric(raw) {
      const num = Number(String(raw || "").replace(/,/g, "").trim());
      return Number.isFinite(num) ? num : 0;
    }

    function computeCoverage(rows, distressedZips) {
      const outreachByZip = new Map();

      rows.forEach((row) => {
        const zip = normalizeZip(row.ZipCode || row.extracted_zip || row.zip || row.ZIP || "");
        if (!zip) return;

        if (!outreachByZip.has(zip)) {
          outreachByZip.set(zip, { events: 0, attendees: 0 });
        }

        const item = outreachByZip.get(zip);
        item.events += 1;
        item.attendees += numeric(row.AttendeesOrViews || row.Attendees || row.Views || row.attendees || "0");
      });

      const result = distressedZips.map((zip) => {
        const item = outreachByZip.get(zip) || { events: 0, attendees: 0 };
        return {
          zip,
          city: cityForZip(zip),
          events: item.events,
          attendees: item.attendees,
          status: item.events > 0 ? "Served" : "Not Served"
        };
      });

      result.sort((a, b) => {
        if (a.events !== b.events) return a.events - b.events;
        if (a.attendees !== b.attendees) return a.attendees - b.attendees;
        return a.zip.localeCompare(b.zip);
      });

      return result;
    }

    function renderRows(rows) {
      resultsBodyEl.innerHTML = "";

      rows.forEach((row, idx) => {
        const tr = document.createElement("tr");
        if (row.events === 0) tr.classList.add("zero");

        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${row.zip}</td>
          <td>${row.city || "—"}</td>
          <td>${row.events}</td>
          <td>${Math.round(row.attendees).toLocaleString("en-US")}</td>
          <td>${row.status}</td>
        `;
        resultsBodyEl.appendChild(tr);
      });
    }

    function renderKpis(rows) {
      const total = rows.length;
      const served = rows.filter(r => r.events > 0).length;
      const unserved = total - served;
      const coverage = total ? (served / total) * 100 : 0;

      kpiDistressedEl.textContent = String(total);
      kpiServedEl.textContent = String(served);
      kpiUnservedEl.textContent = String(unserved);
      kpiCoverageEl.textContent = `${coverage.toFixed(1)}%`;
    }

    function clearResults() {
      statusEl.textContent = "";
      resultsBodyEl.innerHTML = "";
      kpiDistressedEl.textContent = "0";
      kpiServedEl.textContent = "0";
      kpiUnservedEl.textContent = "0";
      kpiCoverageEl.textContent = "0.0%";
    }

    function analyze() {
      clearResults();

      const distressed = parseDistressedZips(distressedInputEl.value);
      if (!distressed.length) {
        statusEl.textContent = "Paste at least one 5-digit ZIP code in the distressed list.";
        return;
      }

      if (!loadedCsvText) {
        statusEl.textContent = "Load your outreach CSV first or use the default CSV if available.";
        return;
      }

      const rows = parseCsvRows(loadedCsvText);
      if (!rows.length) {
        statusEl.textContent = "CSV appears empty or could not be parsed.";
        return;
      }

      const coverageRows = computeCoverage(rows, distressed);
      renderKpis(coverageRows);
      renderRows(coverageRows);
      statusEl.textContent = `Analysis complete: ranked ${coverageRows.length} distressed ZIP codes from least served to most served.`;
    }

    async function loadDefaultCsv() {
      statusEl.textContent = "Loading default outreach CSV...";
      try {
        const response = await fetch("outreach_events_clean_geocoded.csv");
        if (!response.ok) throw new Error("HTTP " + response.status);

        loadedCsvText = await response.text();
        statusEl.textContent = "Default CSV loaded. Ready to analyze.";
      } catch (err) {
        loadedCsvText = "";
        statusEl.textContent = "No default CSV was found in this folder. Use the file picker to load your outreach data.";
      }
    }

    document.getElementById("loadDefaultBtn").addEventListener("click", loadDefaultCsv);

    csvFileInputEl.addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      loadedCsvText = await file.text();
      statusEl.textContent = `Loaded CSV: ${file.name}`;
    });

    document.getElementById("analyzeBtn").addEventListener("click", analyze);
    document.getElementById("clearBtn").addEventListener("click", clearResults);

    // Optional auto-load if file exists in same folder
    loadDefaultCsv();
  </script>
</body>
